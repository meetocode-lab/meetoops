# MeetoOps — Zero-Configuration Production Docker Compose
# Quick start:
#   git clone https://github.com/meetocode-lab/meetoops.git
#   cd meetoops
#   docker compose up -d --build
#
# No .env file required. Default port: 9480

services:
  meetoops:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    image: meetoops:latest
    container_name: meetoops
    restart: unless-stopped
    # Host networking allows MeetoOps to reach local 127.0.0.1 published DB/Redis ports
    # without UFW firewall timeouts and collects real host NIC telemetry on Linux VPS.
    network_mode: host
    volumes:
      - meetoops_data:/data
      - meetoops_keys:/data/keys
      # Mount local Docker socket for local host container management.
      # Remove this line if managing remote servers via meetoops-agent only.
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/meetoops-server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  meetoops_data:
  meetoops_keys:
