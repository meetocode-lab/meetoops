<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetoOps — Your Infrastructure. One Control Center.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var pref = localStorage.getItem('meetoops-theme-preference') || 'system';
        var resolved =
          pref === 'dark' || pref === 'light'
            ? pref
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
  </head>
  <body class="bg-[var(--background)] text-[var(--foreground)] antialiased selection:bg-[var(--primary-subtle)] selection:text-[var(--foreground)]">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
