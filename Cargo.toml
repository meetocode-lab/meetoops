[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/security",
    "crates/core",
    "crates/docker",
    "crates/discovery",
    "crates/monitoring",
    "crates/database",
    "crates/redis",
    "crates/ssh",
    "services/server",
    "services/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MeetoOps Contributors"]
repository = "https://github.com/meetoops/meetoops"

[workspace.dependencies]
# Async & Web
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header", "compression-gzip"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization & Types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.12", features = ["v4", "v7", "serde"] }
thiserror = "2.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }

# Security & Crypto
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"

# Docker & System
bollard = "0.18"
sysinfo = "0.33"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Internal Crates
meetoops-common = { path = "crates/common" }
meetoops-security = { path = "crates/security" }
meetoops-core = { path = "crates/core" }
meetoops-docker = { path = "crates/docker" }
meetoops-discovery = { path = "crates/discovery" }
meetoops-monitoring = { path = "crates/monitoring" }
meetoops-database = { path = "crates/database" }
meetoops-redis = { path = "crates/redis" }
meetoops-ssh = { path = "crates/ssh" }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
